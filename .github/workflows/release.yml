name: Publish to PyPI

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    if: "${{ github.ref_type == 'tag' || startsWith(github.event.head_commit.message, 'release: TrainLens ') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - name: Resolve and create release tag
        id: release_tag
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import tomllib
          from pathlib import Path

          print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])
          PY
          )
          PACKAGE_VERSION=$(python - <<'PY'
          import re
          from pathlib import Path

          text = Path("src/trainlens/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*"([^"]+)"', text, flags=re.MULTILINE)
          if match is None:
              raise SystemExit("could not find trainlens.__version__")
          print(match.group(1))
          PY
          )
          if [[ "${PACKAGE_VERSION}" != "${VERSION}" ]]; then
            echo "package version ${PACKAGE_VERSION} does not match project version ${VERSION}" >&2
            exit 1
          fi

          EXPECTED_TAG="v${VERSION}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
              echo "tag ${GITHUB_REF_NAME} does not match package version ${VERSION}" >&2
              exit 1
            fi
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="${EXPECTED_TAG}"
            git fetch --tags --force
            if git rev-parse "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              TAGGED_COMMIT=$(git rev-list -n 1 "${RELEASE_TAG}")
              if [[ "${TAGGED_COMMIT}" != "${GITHUB_SHA}" ]]; then
                echo "${RELEASE_TAG} already points at ${TAGGED_COMMIT}, not ${GITHUB_SHA}" >&2
                exit 1
              fi
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "${RELEASE_TAG}" "${GITHUB_SHA}" -m "TrainLens ${VERSION}"
              git push origin "${RELEASE_TAG}"
            fi
          fi

          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Build clean distributions
        run: |
          rm -rf dist
          python -m build
          python -m twine check dist/*
      - name: Install and smoke-test built wheel
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release_tag.outputs.version }}
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --upgrade pip
          .release-venv/bin/python -m pip install dist/*.whl
          .release-venv/bin/python - <<'PY'
          import json
          import os
          from importlib.metadata import version

          from trainlens import __version__, compare_runs, render_report

          expected = os.environ["RELEASE_VERSION"]
          assert __version__ == expected
          assert version("trainlens") == expected
          comparison = compare_runs({"loss": 1.0}, {"loss": 0.8})
          payload = json.loads(render_report(comparison, format="json"))
          assert payload["metrics"][0]["name"] == "loss"
          import matplotlib

          matplotlib.use("Agg")
          from matplotlib import pyplot as plt
          from trainlens import plot_training_curves
          from trainlens.models.analysis import AnalysisResult

          pdf = render_report(AnalysisResult(metrics={"loss": 0.5}), format="pdf")
          assert isinstance(pdf, bytes) and pdf.startswith(b"%PDF-")
          figure = plot_training_curves(
              {"history": {"train_loss": [1.0, 0.7], "val_loss": [1.1, 0.8]}},
              metrics=("loss",),
          )
          assert len(figure.axes) == 1
          plt.close(figure)
          print(f"installed TrainLens {expected} with plots/PDF: PASS")
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/trainlens
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub release ${RELEASE_TAG} already exists."
          else
            VERSION="${RELEASE_TAG#v}"
            NOTES_FILE=".github/release-notes/${VERSION}.md"

            if [[ -f "${NOTES_FILE}" ]]; then
              gh release create "${RELEASE_TAG}" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "TrainLens ${VERSION}" \
                --notes-file "${NOTES_FILE}"
            else
              gh release create "${RELEASE_TAG}" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "TrainLens ${VERSION}" \
                --generate-notes
            fi
          fi
